[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra --strict-markers
markers =
    unit: isolated rule or service tests with mocked dependencies
    integration: local database, API, filesystem, or component integration
    smoke: key business regression tests to run before a release
    video: real local video encoding or model replay; enable with --run-video
    electronic_seal_mysql: opt-in integration tests against a real MySQL server
