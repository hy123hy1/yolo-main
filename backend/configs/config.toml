[Server]
  Host = "0.0.0.0"
  EnableTraining = true

  [Server.HTTP]
    Port = 8000

[Data]
  MetadataDBEnabled = true
  MetadataDBStrict = false

  [Data.Database]
    # Default mode: SQLite file path
    # Examples:
    #   ./data/metadata.db
    #   mysql+pymysql://yolo:yolo123456@127.0.0.1:3306/yolo_meta?charset=utf8mb4
    #   postgresql+psycopg2://postgres:123456@127.0.0.1:5432/yolo_meta
    Dsn = "./data/metadata.db"

[Media]
  APIBase = "http://host.docker.internal:8010"
  PlayBase = "http://localhost:8010"
  WebRTCBase = "webrtc://localhost:8010"
  Secret = ""
  PublicRTSPHost = "localhost"
  PublicRTMPHost = "localhost"
  PublicHTTPHost = "localhost"
  RTSPPort = 554
  RTMPPort = 1935
  HTTPPort = 8010
  HTTPSPort = 443
  HLSFile = "hls.fmp4.m3u8"
  HTTPFLVSuffix = ".live.flv"
  WebRTCPath = "/index/api/webrtc"
