[Server]
  Host = "0.0.0.0"
  EnableTraining = true

  [Server.HTTP]
    Port = 8000

  [Server.Web]
    PublicBase = "http://192.168.1.61:3000"

  [Server.Monitor]
    HostAgentURL = ""
    HostAgentTimeoutSeconds = 2
    HostMetricsFile = "data/host_monitor_resources.json"
    HostMetricsMaxAgeSeconds = 10

  [Server.Startup]
    TaskRestoreInitialDelaySeconds = 2
    TaskRestoreStaggerSeconds = 0.5
    TaskPreviewWarmupStartupDelaySeconds = 2
    TaskPreviewWarmupMaxConcurrency = 1
    TaskAnalysisStartupWarmupSeconds = 5
    TaskAnalysisAlgorithmMaxConcurrency = 3
    AlarmVideoBeforeSeconds = 10
    AlarmVideoAfterSeconds = 10
    AlarmVideoJobMaxWorkers = 2
    TaskAlarmVideoCaptureTimeoutSeconds = 25
    TaskAlarmVideoReadFailLimit = 20

[AlarmPush]
  # Default receiver, synchronized to the target table on backend startup.
  Enabled = true
  # push address
  PushURL = "http://192.168.1.16:15299/api/open/camera_ai_alarm"
  # Address reachable by the receiving Java server, not a container hostname.
  PublicBaseURL = "http://192.168.1.61:8000"
  TimeoutSeconds = 10
  # Total delivery attempts, including the first request.
  MaxAttempts = 3

[Data]
  MetadataDBEnabled = true
  MetadataDBStrict = false

  [Data.Database]
    # Default mode: SQLite file path
    # Examples:
    #   ./data/metadata.db
    #   mysql+pymysql://root:root@192.168.1.58:3006/sp-ai-yolo?charset=utf8mb4
    #   postgresql+psycopg2://postgres:123456@127.0.0.1:5432/sp_ai_yolo
    Dsn = "mysql+pymysql://root:root@192.168.1.200:3307/sp-ai-yolo?charset=utf8mb4"

[AI]
  # auto: use cuda:0 when CUDA is visible, otherwise CPU.
  # cuda:0: prefer the first NVIDIA GPU and fall back to CPU if unavailable.
  InferenceDevice = "cuda:0"
  # Adaptive placement applies only to continuous video AI detection tasks.
  TaskGpuAdaptive = true
  # CUDA-local indices visible inside the backend container.
  # GpuCandidates = "0,1,2,3"
  GpuCandidates = "0"
  GpuMinFreeMB = 2048
  GpuTaskReserveMB = 1024

[Media]
  APIBase = "http://host.docker.internal:8010"
  PlayBase = "http://192.168.1.61:8010"
  WebRTCBase = "webrtc://192.168.1.61:8010"
  Secret = ""
  PublicRTSPHost = "192.168.1.61"
  PublicRTMPHost = "192.168.1.61"
  PublicHTTPHost = "192.168.1.61"
  RTSPPort = 554
  RTMPPort = 1935
  HTTPPort = 8010
  HTTPSPort = 443
  HLSFile = "hls.fmp4.m3u8"
  HTTPFLVSuffix = ".live.flv"
  WebRTCPath = "/index/api/webrtc"

[WVP]
  Enabled = true
  APIBase = "http://192.168.1.36:18080"
  #APIBase = "http://10rg9383km827.vicp.fun:18080"
  ChannelListPath = "/api/common/channel/list"
  ChannelPlayPath = "/api/common/channel/play"
  PublicFLVBase = "http://192.168.1.36:80"
  # PublicFLVBase = "http://10rg9383km827.vicp.fun:8008"

[CameraHealth]
  Enabled = true
  SampleIntervalMs = 1000
  FrameStaleSeconds = 5
  WarmupSeconds = 30
  AlarmHoldSeconds = 10
  RecoveryHoldSeconds = 15
  MaxWorkers = 8
  ThresholdsFile = "configs/camera_health_thresholds.toml"
