services:
  # 每天自动创建 aks_dzft_* 次日表
  # 用法:
  #   cd tools
  #   docker compose up -d
  # 查看日志:
  #   docker logs -f aks-create-tables
  create-tables:
    image: xgb_ch4:v2
    container_name: aks-create-tables
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    volumes:
      # 服务器部署目录
      - /jq/sc/app:/app
      # 本地调试可改成:
      # - ./:/app
    environment:
      - TZ=Asia/Shanghai
      # 每天触发时间
      - RUN_HOUR=12
      - RUN_MINUTE=0
      # 数据库连接
      - AKS_DB_HOST=10.13.11.3
      - AKS_DB_PORT=54321
      - AKS_DB_NAME=aks
      - AKS_DB_USER=system
      - AKS_DB_PASSWORD=Password@2025
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[$$(date '+%F %T')] start scheduler with image xgb_ch4:v2"
        while true; do
          SLEEP_SECONDS=$$(python -c "from datetime import datetime,timedelta; import os; h=int(os.getenv('RUN_HOUR','23')); m=int(os.getenv('RUN_MINUTE','0')); now=datetime.now(); t=now.replace(hour=h,minute=m,second=0,microsecond=0); t=t+timedelta(days=1) if now>=t else t; print(max(1,int((t-now).total_seconds())))")
          echo "[$$(date '+%F %T')] next run in $${SLEEP_SECONDS}s (schedule $${RUN_HOUR}:$${RUN_MINUTE})"
          sleep "$${SLEEP_SECONDS}"
          echo "[$$(date '+%F %T')] create next-day tables..."
          if python app.py; then
            echo "[$$(date '+%F %T')] success"
          else
            echo "[$$(date '+%F %T')] failed, will retry next schedule"
          fi
        done
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
