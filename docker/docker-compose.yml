# YOLO Training Platform - Docker Compose Configuration
#
# 开发模式:
#   cd docker
#   docker compose up -d backend frontend-dev
#   本地播放地址默认使用 192.168.1.61；服务器部署时通过环境变量覆盖为服务器地址。
#   例如：ZLM_PUBLIC_HTTP_HOST=192.168.60.61 docker compose up -d backend frontend
#
# 生产预览模式:
#   cd docker
#   docker compose up -d --build backend frontend

services:
  zlm-server:
    image: zlmediakit/zlmediakit:master
    container_name: zlm-server
    restart: unless-stopped
    ports:
      - "8010:8010"
      - "443:443"
      - "1935:1935"
      - "554:554"
      - "3011:3011"
      - "8011:8011"
      - "8011:8011/udp"
      - "3478:3478"
      - "3478:3478/udp"
      - "10000:10000"
      - "10000:10000/udp"
      - "9000:9000/udp"
    volumes:
      - ../docker/zlm/conf:/opt/media/conf
      - ../docker/zlm/www:/opt/media/bin/www
      - ../docker/zlm/log:/opt/media/bin/log
      - ../docker/zlm/ffmpeg:/opt/media/bin/ffmpeg
    networks:
      - yolo-network

  backend:
    #build:
      #context: ..
      #dockerfile: docker/backend/Dockerfile
      # Before building backend, build the reusable base image once:
      # docker build -f docker/backend/Dockerfile.base -t yolo-backend-base:torch-cu128 ..
    image: docker-backend
    container_name: yolo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../backend/configs:/app/configs
      - ../backend/data:/app/data
      - ../backend/models:/app/models
      - ../backend/src:/app/src
    gpus: all
    shm_size: "24gb"
    networks:
      - yolo-network
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - AI_INFERENCE_DEVICE=cuda:0
      - TZ=Asia/Shanghai
      - WEB_PUBLIC_BASE=${WEB_PUBLIC_BASE:-http://192.168.1.61:3000}
      - METADATA_DB_ENABLED=true
      - METADATA_DB_STRICT=false
      - METADATA_DATABASE_URL=mysql+pymysql://root:root@192.168.1.200:3307/sp-ai-yolo?charset=utf8mb4
      - ZLM_PLAY_BASE=${ZLM_PLAY_BASE:-http://192.168.1.61:8010}
      - ZLM_WEBRTC_BASE=${ZLM_WEBRTC_BASE:-webrtc://192.168.1.61:8010}
      - ZLM_PUBLIC_RTSP_HOST=${ZLM_PUBLIC_RTSP_HOST:-192.168.1.61}
      - ZLM_PUBLIC_RTMP_HOST=${ZLM_PUBLIC_RTMP_HOST:-192.168.1.61}
      - ZLM_PUBLIC_HTTP_HOST=${ZLM_PUBLIC_HTTP_HOST:-192.168.1.61}
      - TASK_DETECTION_DEBUG_IDS=f5035e1e
      - ZLM_API_BASE=http://zlm-server:8010
      - ZLM_SECRET=HC5elxV5pt8guwuvV8NmddzVhb4u1lyY
    depends_on:
      - zlm-server
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  electronic-seal-worker:
    image: docker-backend
    container_name: electronic-seal-worker
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - ../backend/configs:/app/configs:ro
      - ../backend/data/electronic_seal:/app/data/electronic_seal
      - ../backend/models:/app/models:ro
      - ../backend/src:/app/src:ro
    gpus: all
    networks:
      - yolo-network
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      ELECTRONIC_SEAL_DEVICE: "cuda:0"
      ELECTRONIC_SEAL_ENABLED: "true"
      ELECTRONIC_SEAL_MAX_WORKERS: "2"
      ELECTRONIC_SEAL_MAX_CHANNEL_WORKERS: "8"
      ELECTRONIC_SEAL_FRAME_FIRST_FRAME_GRACE_SECONDS: "15"
      ELECTRONIC_SEAL_BASELINE_WARMUP_SECONDS: "15"
      ELECTRONIC_SEAL_BASELINE_MIN_VALID_FRAMES: "10"
      ELECTRONIC_SEAL_BASELINE_MAX_CALIBRATION_SECONDS: "60"
      ELECTRONIC_SEAL_ONLINE_STATUS_INTERVAL_SECONDS: "3600"
      ZLM_API_BASE: "http://zlm-server:8010"
      ZLM_SECRET: "HC5elxV5pt8guwuvV8NmddzVhb4u1lyY"
      ZLM_PLAY_BASE: "http://192.168.1.61:8010"
      ZLM_WEBRTC_BASE: "webrtc://192.168.1.61:8010"
      ZLM_PUBLIC_HTTP_HOST: "192.168.1.61"
      MYSQL_HOST: "192.168.1.2000"
      MYSQL_PORT: "3307"
      MYSQL_DATABASE: "sp-ai-yolo"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_CHARSET: "utf8mb4"
      METADATA_DATABASE_URL: "mysql+pymysql://root:root@192.168.1.200:3307/sp-ai-yolo?charset=utf8mb4"
      METADATA_DB_ENABLED: "true"
      METADATA_DB_STRICT: "false"
      TZ: "Asia/Shanghai"
    command: ["uvicorn", "src.electronic_seal.main:app", "--host", "0.0.0.0", "--port", "9001"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2g"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: yolo-frontend
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "3000:80"
    networks:
      - yolo-network
    depends_on:
      - backend
      - zlm-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend-dev:
    image: node:22-alpine
    container_name: yolo-frontend-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    networks:
      - yolo-network
    depends_on:
      - backend
      - zlm-server
      - electronic-seal-worker
    volumes:
      - ../frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE=/dev-api
      - VITE_API_TARGET=http://backend:8000
      - ELECTRONIC_SEAL_API_TARGET=http://electronic-seal-worker:9001
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]

networks:
  yolo-network:
    driver: bridge
    name: yolo-network
